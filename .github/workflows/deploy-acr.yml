name: Build and push to Azure Container Registry

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  REGISTRY_NAME: ${{ secrets.ACR_NAME }}
  IMAGE_NAME: devops-aimonitor
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Azure Container Registry if needed
        run: |
          az acr show -n ${{ env.REGISTRY_NAME }} >/dev/null 2>&1 || \
          az acr create -n ${{ env.REGISTRY_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --sku Basic

      - name: Log in to ACR
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build Docker image
        run: |
          docker build -f backend/DevOpsAIMonitor.Api/Dockerfile -t ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: docker push ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
