trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

stages:
- stage: BuildAndValidate
  displayName: Build and Validate
  jobs:
  - job: FrontendBuild
    displayName: Frontend Build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        cd frontend
        npm install
        npm run build
      displayName: 'Install and build frontend'

  - job: BackendBuild
    displayName: Backend Build
    steps:
    - task: UseDotNet@2
      inputs:
        version: '8.0.x'
    - script: |
        cd backend/DevOpsAIMonitor.Api
        dotnet restore
        dotnet build --configuration $(buildConfiguration)
      displayName: 'Restore and build backend'

  - job: BackendPublish
    displayName: Backend Publish
    dependsOn: BackendBuild
    condition: succeeded()
    steps:
    - task: UseDotNet@2
      inputs:
        version: '8.0.x'
    - script: |
        cd backend/DevOpsAIMonitor.Api
        dotnet publish -c $(buildConfiguration) -o publish
      displayName: 'Publish backend artifact'

- stage: DeployPreview
  displayName: Deploy Preview
  dependsOn: BuildAndValidate
  condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: PreviewInfo
    displayName: PR Preview Info
    steps:
    - script: |
        echo "Pull request validation pipeline is running"
        echo "PR details will be available from Azure DevOps UI"
      displayName: 'Report PR pipeline status'
