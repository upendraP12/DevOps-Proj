name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Restore backend
        run: |
          cd backend/DevOpsAIMonitor.Api
          dotnet restore

      - name: Build backend
        run: |
          cd backend/DevOpsAIMonitor.Api
          dotnet build --configuration Release --no-restore

  push-to-acr:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create or use ACR
        run: |
          az acr show -n ${{ secrets.ACR_NAME }} >/dev/null 2>&1 || \
          az acr create -n ${{ secrets.ACR_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --sku Basic

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build -f backend/DevOpsAIMonitor.Api/Dockerfile -t ${{ secrets.ACR_NAME }}.azurecr.io/devops-aimonitor:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/devops-aimonitor:latest
