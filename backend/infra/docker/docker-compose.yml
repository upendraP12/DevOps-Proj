version: '3.9'
services:
  api:
    build:
      context: ../../backend/DevOpsAIMonitor.Api
      dockerfile: Dockerfile
    ports:
      - 5000:80
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=DevOpsAIMonitorDb;User Id=sa;Password=Your_password123;
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - 4173:4173
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
