version: '3.9'
services:
  api:
    build:
      context: ../../backend/DevOpsAIMonitor.Api
      dockerfile: ../../infra/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/devops.db"
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../../frontend/Dockerfile
    ports:
      - "4173:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
